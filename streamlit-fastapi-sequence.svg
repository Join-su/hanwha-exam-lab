<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 14px Arial, sans-serif; fill: #94a3b8; }
      .lane-title { font: 700 16px Arial, sans-serif; fill: #f8fafc; }
      .lane-sub { font: 12px monospace; fill: #94a3b8; }
      .label { font: 13px monospace; fill: #e2e8f0; }
      .small { font: 12px monospace; fill: #cbd5e1; }
      .tiny { font: 11px monospace; fill: #94a3b8; }
      .note { font: 12px Arial, sans-serif; fill: #cbd5e1; }
      .box { fill: #0f172a; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#020617"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="70" y="58" class="title">Streamlit → FastAPI → Streamlit</text>
  <text x="70" y="86" class="subtitle">ex0910 / 사용자 입력부터 결과 화면 표시까지의 실제 변수·함수 흐름</text>
  <circle cx="1510" cy="52" r="7" fill="#34d399"/>
  <text x="1530" y="57" class="tiny">CODE FLOW</text>

  <!-- participant headers -->
  <rect x="55" y="120" width="220" height="78" class="box" stroke="#fbbf24" fill="#1e293b"/>
  <text x="165" y="151" text-anchor="middle" class="lane-title">사용자</text>
  <text x="165" y="177" text-anchor="middle" class="lane-sub">입력 / 클릭 / 결과 확인</text>

  <rect x="330" y="120" width="310" height="78" class="box" stroke="#22d3ee" fill="#083344"/>
  <text x="485" y="151" text-anchor="middle" class="lane-title">Streamlit UI</text>
  <text x="485" y="177" text-anchor="middle" class="lane-sub">prj_streamlit/app.py</text>

  <rect x="695" y="120" width="220" height="78" class="box" stroke="#fb923c" fill="#431407"/>
  <text x="805" y="151" text-anchor="middle" class="lane-title">HTTP</text>
  <text x="805" y="177" text-anchor="middle" class="lane-sub">requests.post()</text>

  <rect x="970" y="120" width="300" height="78" class="box" stroke="#34d399" fill="#064e3b"/>
  <text x="1120" y="151" text-anchor="middle" class="lane-title">FastAPI Backend</text>
  <text x="1120" y="177" text-anchor="middle" class="lane-sub">prj_fastapi/main.py</text>

  <rect x="1325" y="120" width="220" height="78" class="box" stroke="#a78bfa" fill="#4c1d95"/>
  <text x="1435" y="151" text-anchor="middle" class="lane-title">Pydantic</text>
  <text x="1435" y="177" text-anchor="middle" class="lane-sub">UserInput 검증</text>

  <!-- lifelines -->
  <line x1="165" y1="198" x2="165" y2="900" stroke="#64748b" stroke-dasharray="5,7"/>
  <line x1="485" y1="198" x2="485" y2="900" stroke="#22d3ee" stroke-dasharray="5,7"/>
  <line x1="805" y1="198" x2="805" y2="900" stroke="#fb923c" stroke-dasharray="5,7"/>
  <line x1="1120" y1="198" x2="1120" y2="900" stroke="#34d399" stroke-dasharray="5,7"/>
  <line x1="1435" y1="198" x2="1435" y2="900" stroke="#a78bfa" stroke-dasharray="5,7"/>

  <!-- step 1 -->
  <line x1="165" y1="245" x2="485" y2="245" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="205" y="213" width="240" height="25" rx="5" fill="#78350f"/>
  <text x="325" y="231" text-anchor="middle" class="small">이름 입력: 홍길동</text>
  <text x="500" y="267" class="tiny">st.text_input() → name</text>

  <!-- step 2 -->
  <line x1="165" y1="310" x2="485" y2="310" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="205" y="278" width="240" height="25" rx="5" fill="#78350f"/>
  <text x="325" y="296" text-anchor="middle" class="small">나이 입력: 20</text>
  <text x="500" y="332" class="tiny">st.number_input() → age</text>

  <!-- step 3 -->
  <line x1="165" y1="375" x2="485" y2="375" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="205" y="343" width="240" height="25" rx="5" fill="#78350f"/>
  <text x="325" y="361" text-anchor="middle" class="small">백엔드로 전송 클릭</text>
  <text x="500" y="397" class="tiny">st.form_submit_button() → submit_button=True</text>

  <!-- step 4 local payload -->
  <rect x="350" y="420" width="270" height="82" class="box" stroke="#22d3ee" fill="#083344"/>
  <text x="485" y="445" text-anchor="middle" class="label">payload 생성</text>
  <text x="375" y="470" class="small">{ "name": name,</text>
  <text x="375" y="490" class="small">  "age": age }</text>

  <!-- step 5 HTTP -->
  <line x1="485" y1="545" x2="805" y2="545" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="645" y="532" text-anchor="middle" class="label">requests.post()</text>
  <text x="645" y="566" text-anchor="middle" class="tiny">POST /predict + JSON payload</text>

  <!-- step 6 route -->
  <line x1="805" y1="610" x2="1120" y2="610" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="962" y="597" text-anchor="middle" class="label">POST /predict 라우팅</text>

  <!-- pydantic validation -->
  <line x1="1120" y1="675" x2="1435" y2="675" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="1277" y="661" text-anchor="middle" class="label">UserInput(data) 검증</text>
  <text x="1277" y="696" text-anchor="middle" class="tiny">name: str / age: int</text>

  <line x1="1435" y1="730" x2="1120" y2="730" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1277" y="718" text-anchor="middle" class="tiny">검증된 data 객체</text>

  <!-- backend logic -->
  <rect x="980" y="760" width="280" height="110" class="box" stroke="#34d399" fill="#064e3b"/>
  <text x="1120" y="785" text-anchor="middle" class="label">process_data(data)</text>
  <text x="1000" y="812" class="small">is_adult = data.age &gt;= 19</text>
  <text x="1000" y="834" class="small">message 생성</text>
  <text x="1000" y="856" class="small">결과 dict 반환</text>

  <!-- response return path, curved -->
  <path d="M 980 900 C 900 930, 700 930, 485 900" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="735" y="921" text-anchor="middle" class="label">HTTP 200 + response JSON</text>

  <!-- UI result display -->
  <rect x="350" y="755" width="270" height="105" class="box" stroke="#22d3ee" fill="#083344"/>
  <text x="485" y="780" text-anchor="middle" class="label">response 처리</text>
  <text x="370" y="807" class="small">response.status_code 확인</text>
  <text x="370" y="829" class="small">result = response.json()</text>
  <text x="370" y="851" class="small">result["result_message"]</text>

  <!-- final user display -->
  <line x1="485" y1="900" x2="165" y2="900" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="325" y="887" text-anchor="middle" class="label">st.success() / st.write()</text>

  <!-- legend -->
  <rect x="70" y="930" width="1475" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <circle cx="95" cy="947" r="6" fill="#22d3ee"/><text x="110" y="951" class="tiny">Streamlit UI</text>
  <circle cx="260" cy="947" r="6" fill="#fb923c"/><text x="275" y="951" class="tiny">HTTP</text>
  <circle cx="350" cy="947" r="6" fill="#34d399"/><text x="365" y="951" class="tiny">FastAPI</text>
  <circle cx="455" cy="947" r="6" fill="#a78bfa"/><text x="470" y="951" class="tiny">Pydantic</text>
  <text x="650" y="951" class="tiny">※ 현재 코드는 성인 여부 판정 예제이며 AI 모델 호출은 아직 연결되지 않음</text>
</svg>